<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Analyzer</title>
    <!-- Link to PyScript CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        #output { margin-top: 20px; white-space: pre-wrap; background: #eee; padding: 15px; border-radius: 4px; font-family: monospace; }
        .back-link { margin-bottom: 20px; display: block; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Back to Portfolio</a>
    <h1>Student Result Analyzer</h1>
    
    <div class="input-group">
        <label for="student-name">Student Name:</label>
        <input type="text" id="student-name" placeholder="Enter name">
    </div>
    
    <div class="input-group">
        <label for="student-marks">Marks (comma separated):</label>
        <input type="text" id="student-marks" placeholder="e.g. 80, 90, 75">
    </div>

    <button id="add-btn" py-click="add_student">Add Student & Analyze</button>

    <div id="output">Results will appear here...</div>
</div>

<script type="py">
from pyscript import document

def calculate_average(marks):
    if not marks:
        return 0
    return sum(marks) / len(marks)

def get_grade(average):
    if average >= 90: return "A+"
    elif average >= 80: return "A"
    elif average >= 70: return "B"
    elif average >= 60: return "C"
    else: return "F"

all_students = {}

def add_student(event):
    name = document.querySelector("#student-name").value.strip()
    marks_text = document.querySelector("#student-marks").value.strip()
    output_div = document.querySelector("#output")

    if not name or not marks_text:
        output_div.innerText = "Please enter both name and marks."
        return

    try:
        marks_list = [float(m.strip()) for m in marks_text.split(",")]
        avg = calculate_average(marks_list)
        # Store both marks and average in the dictionary
        all_students[name] = {"marks": marks_list, "avg": avg}
        
        display = "--- Current Results ---\n"
        topper_name = ""
        highest_avg = -1
        total_sum_of_averages = 0

        for s_name, data in all_students.items():
            s_avg = data["avg"]
            s_marks = data["marks"]
            total_sum_of_averages += s_avg
            
            grade = get_grade(s_avg)
            # Show actual marks instead of average here
            display += f"Student: {s_name} | Marks: {s_marks} | Grade: {grade}\n"
            
            if s_avg > highest_avg:
                highest_avg = s_avg
                topper_name = s_name

        class_avg = total_sum_of_averages / len(all_students)

        display += "\n" + "-"*20 + "\n"
        display += f"Class Average: {class_avg:.2f}\n"
        display += f"Current Topper: {topper_name} ({highest_avg:.2f})"
        
        output_div.innerText = display
    except Exception as e:
        output_div.innerText = "Error: Please check your marks format (e.g. 80, 90)."
</script>

</body>
</html>
